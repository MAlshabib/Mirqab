<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="Mirqab C2 tactical track lifecycle"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7eb89a"/></marker><linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4ade80" stop-opacity="0.16"/><stop offset="100%" stop-color="#4ade80" stop-opacity="0.02"/></linearGradient></defs><rect width="1180" height="520" rx="14" fill="#071a14"/><text x="28" y="34" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e8f5e9" text-anchor="start" font-weight="700" opacity="1" letter-spacing="0.3">C2 GATEWAY — tactical track lifecycle</text><text x="28" y="53" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7eb89a" text-anchor="start" font-weight="500" opacity="1" letter-spacing="0">Every fused event upserts a track; status is a pure function of fused confidence</text><line x1="28" y1="68" x2="1152" y2="68" stroke="#1e5640" stroke-width="1" opacity="0.7" stroke-linecap="round"/><rect x="40" y="108" width="220" height="62" rx="10" fill="#0d2a20" stroke="#f59e0b" stroke-width="1.2" opacity="1"/><text x="150.0" y="135.25" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e8f5e9" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">FUSED EVENT</text><text x="150.0" y="152.75" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">confidence_fused</text><line x1="260" y1="139" x2="312" y2="139" stroke="#f59e0b" stroke-width="1.6" opacity="0.85" marker-end="url(#ar)" stroke-linecap="round"/><rect x="320" y="108" width="240" height="62" rx="10" fill="#0d2a20" stroke="#4ade80" stroke-width="1.2" opacity="1"/><text x="440.0" y="135.25" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e8f5e9" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">TRACK ID</text><text x="440.0" y="152.75" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">MRQ-{hex(uuid)[:6] % 1e6:06d}</text><rect x="40" y="212" width="200" height="66" rx="10" fill="#0a2019" stroke="#7eb89a" stroke-width="1.2" opacity="1"/><text x="140.0" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#7eb89a" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">new</text><text x="140.0" y="259" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.6" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">fused &lt; 0.75</text><path d="M 242 245 L 262 245" fill="none" stroke="#7eb89a" stroke-width="1.7" opacity="1" marker-end="url(#ar)" stroke-linecap="round" stroke-linejoin="round"/><rect x="264" y="212" width="200" height="66" rx="10" fill="#0a2019" stroke="#22d3ee" stroke-width="1.2" opacity="1"/><text x="364.0" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22d3ee" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">tracking</text><text x="364.0" y="259" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.6" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">fused ≥ 0.75</text><path d="M 466 245 L 486 245" fill="none" stroke="#22d3ee" stroke-width="1.7" opacity="1" marker-end="url(#ar)" stroke-linecap="round" stroke-linejoin="round"/><rect x="488" y="212" width="200" height="66" rx="10" fill="#0a2019" stroke="#4ade80" stroke-width="1.2" opacity="1"/><text x="588.0" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#4ade80" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">confirmed</text><text x="588.0" y="259" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.6" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">fused ≥ 0.90</text><path d="M 690 245 L 710 245" fill="none" stroke="#4ade80" stroke-width="1.7" opacity="1" marker-end="url(#ar)" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="212" width="200" height="66" rx="10" fill="#0a2019" stroke="#f59e0b" stroke-width="1.2" opacity="1"/><text x="812.0" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#f59e0b" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">handoff_to_radar</text><text x="812.0" y="259" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.6" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">POST /handoff</text><path d="M 914 245 L 934 245" fill="none" stroke="#f59e0b" stroke-width="1.7" opacity="1" marker-end="url(#ar)" stroke-linecap="round" stroke-linejoin="round"/><rect x="936" y="212" width="200" height="66" rx="10" fill="#0a2019" stroke="#dc2626" stroke-width="1.2" opacity="1"/><text x="1036.0" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">lost</text><text x="1036.0" y="259" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.6" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">DELETE /tracks/{id}</text><rect x="40" y="314" width="552" height="92" rx="12" fill="#0d2a20" stroke="#1e5640" stroke-width="1.2" opacity="1"/><text x="64" y="340" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="start" font-weight="700" opacity="1" letter-spacing="0.9">LABEL → CLASSIFICATION</text><text x="64" y="362" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#7eb89a" text-anchor="start" font-weight="500" opacity="1" letter-spacing="0">contains &#x27;uav&#x27; / &#x27;drone&#x27;</text><text x="568" y="362" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#4ade80" text-anchor="end" font-weight="600" opacity="1" letter-spacing="0">UAV · high · handoff_to_radar</text><text x="64" y="380" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#7eb89a" text-anchor="start" font-weight="500" opacity="1" letter-spacing="0">contains &#x27;aircraft&#x27;</text><text x="568" y="380" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#22d3ee" text-anchor="end" font-weight="600" opacity="1" letter-spacing="0">AIRCRAFT · medium · verify_track</text><text x="64" y="398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#7eb89a" text-anchor="start" font-weight="500" opacity="1" letter-spacing="0">otherwise</text><text x="568" y="398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#7eb89a" text-anchor="end" font-weight="600" opacity="1" letter-spacing="0">UNKNOWN · medium · monitor</text><rect x="616" y="314" width="264" height="92" rx="12" fill="#0d2a20" stroke="#1e5640" stroke-width="1.2" opacity="1"/><text x="640" y="340" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="start" font-weight="700" opacity="1" letter-spacing="0.9">ERROR ESTIMATE</text><text x="640" y="364" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e8f5e9" text-anchor="start" font-weight="500" opacity="1" letter-spacing="0">ce = max(30, (1−f)·200) m</text><text x="640" y="384" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#e8f5e9" text-anchor="start" font-weight="500" opacity="1" letter-spacing="0">le = max(50, (1−f)·300) m</text><rect x="904" y="314" width="236" height="92" rx="12" fill="#0a2019" stroke="#a78bfa" stroke-width="1.2" opacity="1"/><text x="1022" y="340" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0.9">EXPORT TAPS</text><text x="1022" y="364" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#e8f5e9" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">GET /cot → CoT XML</text><text x="1022" y="384" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.2" fill="#e8f5e9" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">GET /asterix → CAT062</text><rect x="40" y="428" width="1100" height="62" rx="12" fill="#0d2a20" stroke="#4ade80" stroke-width="1.2" opacity="1"/><text x="64" y="458" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4ade80" text-anchor="start" font-weight="700" opacity="1" letter-spacing="1">BROADCAST</text><rect x="240" y="442" width="196" height="30" rx="15.0" fill="#0a2019" stroke="none" stroke-width="1.2" opacity="1"/><text x="338.0" y="460.96" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">c2:track_created</text><rect x="464" y="442" width="196" height="30" rx="15.0" fill="#0a2019" stroke="none" stroke-width="1.2" opacity="1"/><text x="562.0" y="460.96" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">c2:track_updated</text><rect x="688" y="442" width="196" height="30" rx="15.0" fill="#0a2019" stroke="none" stroke-width="1.2" opacity="1"/><text x="786.0" y="460.96" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">c2:track_handoff</text><rect x="912" y="442" width="196" height="30" rx="15.0" fill="#0a2019" stroke="none" stroke-width="1.2" opacity="1"/><text x="1010.0" y="460.96" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700" opacity="1" letter-spacing="0">c2:track_lost</text><text x="600" y="480" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.8" fill="#7eb89a" text-anchor="middle" font-weight="500" opacity="1" letter-spacing="0">all four events are pushed to every HQ client over /ws/hq</text></svg>